arm_type:
  description: 'Arm type'
  choices: ['tiago-sea', 'no-arm']
  default_value: 'tiago-sea'
end_effector:
  description: 'End effector model'
  choices: ['custom', 'no-end-effector', 'pal-pro-gripper']
  default_value: 'pal-pro-gripper'
ft_sensor:
  description: 'FT sensor model'
  choices: ['rokubi', 'no-ft-sensor']
  default_value: 'rokubi'
wrist_model:
  description: "Wrist model"
  choices: ['spherical-wrist']
  default_value: 'spherical-wrist'

